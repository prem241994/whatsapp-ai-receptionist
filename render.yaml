services:
  - type: web
    name: whatsapp-receptionist-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @whatsapp-receptionist/db generate && pnpm --filter @whatsapp-receptionist/db exec prisma migrate deploy && pnpm --filter @whatsapp-receptionist/db build && pnpm --filter @whatsapp-receptionist/api build
    startCommand: node apps/api/dist/src/server.js
    healthCheckPath: /health/live
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_URL
        fromService:
          name: whatsapp-receptionist-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: INTERNAL_WORKER_SECRET
        generateValue: true
      - key: EMBEDDED_WORKER_ENABLED
        value: true
      - key: WORKER_INTERVAL_MS
        value: 30000
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
